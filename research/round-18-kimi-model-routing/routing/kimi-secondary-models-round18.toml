# DROPPED LANES -- why the two cursor entries are not in the table
# ============================================================================
#
# M3 s8 tags both: RE-BUCKET (slower than the MIDDLE median), SLOW-OUTLIER
# (TTFT > 2x the pool median), NO-TOOL-FORMAT (the tool probe returned no usable
# call). Measured: composer-2.5 7198 ms / 7-9 with a wrong answer on c5;
# cursor-grok-4.5-low-fast 8275 ms / 8-9. M2 s4.2 is the mechanism: "cursor
# answers a tool request with prose ('Calling r18_echo ...') and tool_calls: null".
# The client cannot express chat-only (M2 s3 rule 5: a model declaring only
# ["thinking"] still receives every tool), so the label could not protect a tool
# task from landing there. If the operator keeps a cursor lane anyway, label it
# text-only and never claim latency: the measured numbers above stand.
