#   M1 section 6) and are ranked by TTFT only.

[secondary_model]
default_model = "cascade/deepseek-v4.1-flash"

[secondary_model.models]

# --- FAST: the four lanes whose measured TTFT/TPS survive their label ---
"hyper/deepseek-v4.1-flash" = "FAST rank 1 (hyper lane): measured TTFT 2081 ms, TPS 375.91 tok/s, 8/9 probes [M3 s2]. Latency-first generalist for exploration, codebase search and quick reviews; truncates on thin output budgets, so give it room [M3 s6 c5]."
"alibaba-token-plan/deepseek-v4.1-flash" = "FAST rank 2 (token-plan key 1): 2251 ms to first decoded token -- it spends the whole budget on reasoning before any content token [M3 s2 dagger] -- TPS 226.72, 8/9. Cheap generalist when hyper quota is tight; expect reasoning-first output on small caps."
"zai-coding-plan/glm-5.3-flash-low" = "FAST rank 3 (zai lane): 2796 ms first-decoded, TPS 138.21, 7/9 -- the joint-lowest pass count measured in the pool (tied with the dropped cursor/composer-2.5) [M3 s3]. Use for short read-only checks; the LOW effort pin does not reach the wire today (global [thinking] effort=max wins, M2 s3 rule 2) and zai ignores reasoning_effort (M2 s4.1)."
"cascade/deepseek-v4.1-flash" = "FAST rank 4 and default (CASCADE lane: opencode-go first, hyper fallback, devin third). 3179 ms, burst-flushed so no client-side TPS exists [M3 s2], 8/9. Its value is the cross-provider fallback chain, not raw speed [M3 s8]; legs 1-2 are tool-capable, the devin leg is not [M2 s4.2]."

# --- FAST ladder, last resort: kept for chain value, stripped of its FAST claim ---
"cascade/glm-5.3-flash" = "NOT a FAST lane (demoted). Lane policy (operator directive 2026-10-15): zai-coding-plan is the primary leg, devin the secondary/fallback leg. Measured as configured: 4952 ms -- slower than the MIDDLE median 4172 ms [M3 s8 RE-BUCKET], no tool_calls on the tool probe [M3 s6 t1], and the answering leg billed ~11775 prompt tokens for the identical prompt [M3 s2], which is the devin leg's overhead [M1 D9, M2 s4.2]. Fallback-only: use when both deepseek cascades and token-plan key 1 are exhausted. Operator check: the live glm-flash-shim's leg order may currently be devin-first, which would contradict the declared zai-primary policy -- M2's tool probe was answered by the devin leg in pass 1 and by the zai leg in pass 2 [M2 s4.2]; the shim was not inspected or edited by this mission."

# --- MIDDLE ---
"zai-coding-plan/glm-5-turbo" = "MIDDLE rank 1 (zai lane): 2957 ms, TPS 157.07, 8/9 [M3 s3]. Everyday implementation and refactors at a 200k declared context; truncation-prone on thin budgets [M3 s6 c5]."
"xai-oauth/grok-4.5" = "MIDDLE rank 2 (xai lane): 3476 ms, TPS 66.71, 9/9 -- the pool's most consistent correctness, 500k declared context, image_in [M3 s3]. Bills ~1260 prompt tokens per call [M1 D9]; add reasoning_key per the M2 block (live entry declares none but the lane returns reasoning_content, M2 s4.4 DEF-10)."
"hyper/qwen3.8-flash" = "MIDDLE rank 3 (hyper lane): 4868 ms, TPS 178.96, 9/9 [M3 s3]. Implementation on the alternative provider with 128000 declared output cap; reasoning_key missing on the live entry (M2 DEF-10)."
"alibaba-token-plan/qwen3.8-flash" = "MIDDLE, batch only (demoted): 13282 ms first token, 4.2x the pool median [M3 s8 SLOW-OUTLIER], but 9/9 with the second-highest derivable TPS (235.56) [M3 s3]. Use where long output matters and first-token latency does not."

# --- STRONG ---
"openai-codex/gpt-6.1-sol" = "STRONG rank 1 (codex lane): 2212 ms, TPS 64.46, 9/9 -- the fastest measured bucket member in the pool, measured not assumed [M3 s4]. Needs the M1 D6 request shape (store false, stream true, list input, no temperature, max_output_tokens >= 16) [M1 D6]; no effort pin on the entry, client picks high (M2 DEF-3d)."
"openai-codex/gpt-6.1-sol-high" = "STRONG rank 2, pinned to HIGH effort: 2878 ms, TPS 70.82, 9/9 [M3 s2]. Same shim, same upstream model id as rank 1 -- a second effort pin, not an independent provider fallback [M3 SELECTION s3]."

