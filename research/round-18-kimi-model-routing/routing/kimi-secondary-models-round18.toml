# EFFORT POLICY (what actually reaches the wire)
# ============================================================================
#
# 1. Live global [thinking] effort="max" overrides every model's default and is
#    not clamped to support_efforts (M2 s3 rule 2, DEF-3b, 31 entries). Every
#    library besides the ones that ignore the field receives "max".
