# ============================================================================
# C. Global thinking effort overrides every model's declared effort
#
#    The live config has:
#        [thinking]
#        enabled = true
#        effort = "max"
#
#    C: with that line present the client sends reasoning_effort="max" to
#       every model, including models whose support_efforts do not contain
#       "max" (31 entries, A: DEF-3b) and models that declare no effort support
#       at all. Without the line, each model's default_effort applies, falling
#       back to support_efforts[floor(n/2)] when it has none.
#    P: whether that hurts depends on the lane, measured with one invalid
#       control token per lane (a value in no model's support_efforts). A lane
#       that returns 400 for the control really does validate the value, so its
#       acceptance of xhigh/max is evidence; a lane that returns 200 for the
#       control ignores the field entirely, so its 'acceptance' proves nothing.
#
#
#    Recommended splice (drops the global pin; per-model defaults take over):
#
#        [thinking]
#        enabled = true

#    If a global pin is wanted anyway, `high` is the only value declared by
#    every model in the file; `max` is not.

