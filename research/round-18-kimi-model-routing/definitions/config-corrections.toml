#   json-canonical /16: 61f22a2bbe52d616   (same digest as the M1 census: 61f22a2bbe52d616)
#
# Every block below is a drop-in replacement for the matching [models.*] table
# in ~/.kimi-code/config.toml. `# evidence:` cites the artifact behind each
# change: audit-table.json (A), raw/probes-*.json (P), raw/client-semantics.json (C),
# the M1 census (M1), or the client binary's own strings (B).
#
# Findings: 121 defects / 94 notes / 46 verify-later over 143 model entries

# ============================================================================
# A. Field-level corrections, one merged block per model
#
#    off_effort / max_input_size are inoperative:
#      B: `grep -a -o off_effort ~/.kimi-code/bin/kimi | wc -l` -> 0
#         `grep -a -o max_input_size ~/.kimi-code/bin/kimi | wc -l` -> 0
#      C: setting off_effort changes nothing the client sends; the effort value
#         is chosen from default_effort / support_efforts only.
#
#    Implausible size caps: 26214 / 6553 / 13107 / 25600 are exactly
#    floor(2^18/10), floor(2^16/10), floor(2^17/10) and max_context_size/10 --
#    a unit slip, not a measured limit (A: DEF-2a). max_output_size is really
#    sent as max_tokens (C), so a slip truncates output. The correction is
#    removal: with the field absent the client sends no output cap on these
#    lanes (C: `plain` sends no max_tokens) and the server decides.
#
#    Each block below is the entry with the flagged fields dropped; splice it
#    over the matching [models.*] table.
# ============================================================================

